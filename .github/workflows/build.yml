name: build

on:
  push:
    branches: [main]
    paths: ["source/**", "scripts/**", "README.md", ".github/workflows/build.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check outputs are up to date (PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/build.py --check

      - name: Build and commit (main)
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/build.py
          if [ -n "$(git status --porcelain rules README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rules README.md
            git commit -m "chore: rebuild rules"
            git push
          fi
